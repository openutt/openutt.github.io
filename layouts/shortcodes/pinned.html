{{- $path := .Get "path" | default "propuesta" -}}
{{- with site.GetPage $path -}}
<section class="pinned">
  <style>
    .pinned > h2 { margin: 0 0 0.5rem; margin-bottom: 0;}
    .pinned > article { margin-top: 0; }
  </style>
  <h2 class="text-2xl font-extrabold">{{ $.Get "title" | default "Fijado" }}</h2>
  {{ partial "article-link.html" . }}
</section>
{{- end -}}
